# Live OMP acceptance (YAN-1552, YAN-1555) — a slow, honest gate beside
# validate.yml, which stays runnable without omp and keeps PR-gating on its own.
#
# This workflow downloads a pinned omp release binary from
# github.com/can1357/oh-my-pi, verifies it against the release's SHA256SUMS.txt,
# and runs the opt-in live harnesses. Installing omp or running a harness never
# skips silently: install/download/checksum failures fail the step, and a
# harness that reports SKIP is treated as a failure by the runner step below.
# Only the null / scripted loopback providers on 127.0.0.1 ever serve a model,
# and the harnesses confine every omp call to env -i with a throwaway
# HOME/XDG tree; nothing here calls a real model or a real credential.
#
# Triggers: a weekly cron (stale-release / upstream drift catches), pushes and
# PRs that touch omp-relevant paths, and workflow_dispatch for manual runs.
# All triggers exercise the full matrix; the weekly cron cadence keeps cost bounded.
#
# Harnesses run here (see docs/internal/omp-acceptance.md):
#   scripts/test-omp-native-packages.sh
#   scripts/test-omp-install-lifecycle.sh
#   scripts/test-omp-coexistence.sh
#   scripts/test-omp-rules-settings.sh
#   scripts/test-omp-scripted-sessions.sh
#   scripts/test-omp-runtime-contract-spike.sh
#
# Left out, with the reason recorded:
#   scripts/test-omp-herdr-hooks.sh — needs a real herdr binary, and its most
#     valuable case (L8, a live herdr pane) needs a running herdr daemon. There
#     is no pinned upstream herdr release to install in CI yet, so the harness
#     would only print SKIP and exit 2 in every leg. It stays a local / manual
#     check; see docs/internal/omp-acceptance.md.
#
# Sandbox note (YAN-1555): every harness prefers bwrap with a private network
# namespace and the real home hidden. GitHub-hosted macOS runners have no
# bubblewrap, so macOS legs pass --allow-env-i EXPLICITLY in that step only:
# sandbox = env -i with a throwaway HOME/XDG tree and the null/loopback
# provider, no private network namespace and the real home NOT hidden behind a
# tmpfs. Linux legs never pass --allow-env-i. macOS also lacks GNU coreutils
# (timeout, realpath, sha256sum) and Bash 4 that the harnesses and install.sh
# need, so a macOS-only step installs them with Homebrew and puts them first on PATH.
# The macOS legs are new (YAN-1555): a red macOS leg is real signal, not a flake.
name: Live OMP checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/*omp*'
      - 'scripts/omp_*'
      - 'scripts/test-omp-*.sh'
      - 'scripts/test_omp_*.py'
      - 'ycc/**'
      - 'packages/omp/**'
      - '.omp-plugin/**'
      - 'install.sh'
      - 'scripts/install*.sh'
      - 'scripts/validate.sh'
      - '.github/workflows/omp-live.yml'
  pull_request:
    paths:
      - 'scripts/*omp*'
      - 'scripts/omp_*'
      - 'scripts/test-omp-*.sh'
      - 'scripts/test_omp_*.py'
      - 'ycc/**'
      - 'packages/omp/**'
      - '.omp-plugin/**'
      - 'install.sh'
      - 'scripts/install*.sh'
      - 'scripts/validate.sh'
      - '.github/workflows/omp-live.yml'
  schedule:
    # Weekly, Monday 03:17 UTC. Runs the full matrix.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      harnesses:
        description: 'Space-separated harness names to run (blank = all feasible)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: omp-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-omp:
    name: live-omp (${{ matrix.os }}, omp ${{ matrix.omp }})
    runs-on: ${{ matrix.os }}
    # fail-fast is off so one OS/version never masks the other legs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        omp: ['18.12.2', '18.12.6']
    timeout-minutes: 90
    env:
      OMP_VERSION: ${{ matrix.omp }}
      YCC_OMP_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: python3 -m pip install pyyaml==6.0.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Node deps
        run: npm ci

      # GitHub-hosted ubuntu-latest ships bubblewrap; macOS does not.
      # This step only restores the Linux sandbox when the image dropped it.
      - name: Ensure bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v bwrap >/dev/null 2>&1; then
            bwrap --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version

      # install.sh and the harnesses need Bash 4 and GNU coreutils (timeout,
      # realpath, sha256sum), which stock macOS lacks.
      - name: Install GNU tools (macOS only)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install bash coreutils
          {
            echo "$(brew --prefix)/bin"
            echo "$(brew --prefix coreutils)/libexec/gnubin"
          } >> "$GITHUB_PATH"

      - name: Install pinned omp ${{ matrix.omp }}
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64) asset=omp-linux-x64 ;;
            Linux:ARM64) asset=omp-linux-arm64 ;;
            macOS:ARM64) asset=omp-darwin-arm64 ;;
            macOS:X64) asset=omp-darwin-x64 ;;
            *) echo "no omp release asset for ${RUNNER_OS}/${RUNNER_ARCH}"; exit 1 ;;
          esac
          bindir="$RUNNER_TEMP/omp-bin"
          mkdir -p "$bindir" "$RUNNER_TEMP/omp-download"
          base="https://github.com/can1357/oh-my-pi/releases/download/v${OMP_VERSION}"
          echo "downloading $base/$asset"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/omp-download/$asset" "$base/$asset"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/omp-download/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
          expected=$(awk -v a="$asset" '$2 == a {print $1}' "$RUNNER_TEMP/omp-download/SHA256SUMS.txt")
          test -n "$expected" || { echo "no SHA256SUMS entry for $asset"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$RUNNER_TEMP/omp-download/$asset" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$RUNNER_TEMP/omp-download/$asset" | awk '{print $1}')
          fi
          test "$actual" = "$expected" || { echo "checksum mismatch for $asset: $actual != $expected"; exit 1; }
          install -m 0755 "$RUNNER_TEMP/omp-download/$asset" "$bindir/omp"
          echo "OMP_BIN=$bindir/omp" >> "$GITHUB_ENV"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/omp" --version
          got=$("$bindir/omp" --version | tr -d '[:space:]')
          test "$got" = "omp/${OMP_VERSION}" || { echo "expected omp/${OMP_VERSION}, got $got"; exit 1; }
          # Record what actually ran so a silent downgrade is visible in the log.
          echo "omp under test: $got ($asset, sha256 $actual)"

      - name: Drift guard (requires live omp)
        run: python3 scripts/omp_builtin_commands.py --require

      # Fast, deterministic unit fixtures for the guard above; complements
      # validate.yml, which owns the full validator. No omp needed here.
      - name: Guard fixtures
        run: python3 scripts/test_omp_builtin_commands.py

      - name: Run live harnesses
        shell: bash
        env:
          HARNESS_INPUT: ${{ inputs.harnesses }}
        run: |
          set -uo pipefail
          # --allow-env-i is macOS-only and explicit: bubblewrap cannot exist
          # there, so the harness falls back to env -i + throwaway HOME/XDG.
          # Linux legs deliberately never pass it and fail closed without bwrap.
          sandbox_args=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            sandbox_args=(--allow-env-i)
          elif ! command -v bwrap >/dev/null 2>&1; then
            echo "bwrap is required on Linux; refusing --allow-env-i fallback" >&2
            exit 1
          fi
          all="native-packages install-lifecycle coexistence rules-settings scripted-sessions runtime-contract-spike"
          # herdr-hooks is deliberately absent: it needs a real herdr binary and,
          # for L8, a live herdr daemon. See the header comment and acceptance doc.
          names="$all"
          if [ -n "${HARNESS_INPUT//[[:space:]]/}" ]; then names="$HARNESS_INPUT"; fi
          status=0
          for name in $names; do
            script="scripts/test-omp-${name}.sh"
            case " $all " in
              *" $name "*) ;;
              *) echo "unknown harness: $name (allowed: $all)"; status=1; continue ;;
            esac
            echo "::group::$script $OMP_VERSION on $RUNNER_OS"
            # A SKIP (exit 0/2) must never pass silently in CI.
            if "./$script" "${sandbox_args[@]}" >"$RUNNER_TEMP/${name}.log" 2>&1; then rc=0; else rc=$?; fi
            cat "$RUNNER_TEMP/${name}.log"
            echo "::endgroup::"
            if grep -q '^SKIP' "$RUNNER_TEMP/${name}.log"; then
              echo "$script reported SKIP; CI treats that as a failure" >&2
              status=1
            elif [ "$rc" -ne 0 ]; then
              echo "$script failed with exit $rc" >&2
              status=1
            fi
          done
          exit "$status"
